# Phone app builds in the cloud: no Android Studio or Mac needed.
#  - Android: a test APK for the Pixel (download it from the run's "Artifacts").
#  - iOS: builds the app on a macOS runner to prove it compiles. Installing it on an iPhone needs
#    an Apple Developer account and signing (see docs/MOBILE.md).
name: Phone app

on:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/build.js'
      - 'tests/**'
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests run in tests.yml; the phone builds don't wait for them.
  # Two apps from the same code: ZeroDebtPlan (US) and Plan Financiero (Ecuador), each with its own
  # app id, so both can be on one phone.
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: us, app_id: com.zerodebtplan.app, label: ZeroDebtPlan, file: ZeroDebtPlan }
          - { edition: ec, app_id: com.planfinanciero.ecuador, label: Plan Financiero, file: PlanFinanciero }
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: EDITION=${{ matrix.edition }} node build-www.js
      - run: npx cap sync android
      # Signed with your own key when the secrets are set (docs/MOBILE.md); otherwise with the test
      # key in the repository, and the run says so.
      - name: Your signing key (if set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            { echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"; echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"
            echo "Signed with your own key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Signed with the public test key: set your own (docs/MOBILE.md) before relying on this app."
            echo "Signed with the public test key — set your own key (docs/MOBILE.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the APK (a release build, not debuggable)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PappId=${{ matrix.app_id }} "-PappLabel=${{ matrix.label }}"
      - run: cp android/app/build/outputs/apk/release/app-release.apk ${{ matrix.file }}-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-android-${{ github.run_number }}
          path: mobile/${{ matrix.file }}-${{ github.run_number }}.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: node build-www.js
      - run: npx cap sync ios
      - name: Build for the iOS Simulator (no signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
